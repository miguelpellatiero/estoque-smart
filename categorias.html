<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SmartStock - Categorias</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <h1>Categorias</h1>
    <button onclick="location.href='dashboard.html'" class="btn btn-secondary" style="padding:8px 16px;">Voltar</button>
  </div>

  <div class="page">
    <div class="card">
      <input type="text" id="categoryName" class="input" placeholder="Nome da categoria">
      <button id="addCategoryBtn" class="btn btn-primary btn-block" style="margin-top:12px;">Adicionar</button>
    </div>
    <div id="listaCategorias"></div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">Inicio</a>
    <a href="produtos.html" class="nav-item">Produtos</a>
    <a href="contador.html" class="nav-item">Contar</a>
    <a href="relatorios.html" class="nav-item">Relatorios</a>
  </nav>

  <script type="module">
    import { auth, db } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
    import { createCategory } from "./js/database.js";
    import { showToast } from "./js/utils.js";

    onAuthStateChanged(auth, user => { if (!user) window.location.href = 'index.html'; });

    const lista = document.getElementById('listaCategorias');
    const input = document.getElementById('categoryName');

    function renderCategorias(snapshot) {
      if (snapshot.empty) {
        lista.innerHTML = '<div class="card"><p>Nenhuma categoria cadastrada.</p></div>';
        return;
      }

      lista.innerHTML = '';
      snapshot.forEach(docSnap => {
        const cat = docSnap.data();
        lista.innerHTML += `<div class="card"><strong>${cat.name}</strong></div>`;
      });
    }

    document.getElementById('addCategoryBtn').addEventListener('click', async () => {
      const name = input.value.trim();
      if (!name) return showToast('Informe o nome da categoria', 'error');
      await createCategory(name);
      input.value = '';
      showToast('Categoria criada');
    });

    const q = query(collection(db, 'categories'), orderBy('name'));
    onSnapshot(q, renderCategorias);
  </script>
</body>
</html>
