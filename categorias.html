<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SmartStock - Categorias</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#6366f1">
</head>
<body>
  <div class="header">
    <h1>Categorias</h1>
    <button onclick="location.href='dashboard.html'" class="btn btn-secondary" style="padding:8px 16px;">Voltar</button>
  </div>

  <div class="page">
    <div class="card">
      <input type="text" id="categoryName" class="input" placeholder="Nome da categoria">
      <button id="addCategoryBtn" class="btn btn-primary btn-block" style="margin-top:12px;">Adicionar</button>
    </div>
    <div id="listaCategorias"></div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">Inicio</a>
    <a href="produtos.html" class="nav-item">Produtos</a>
    <a href="contador.html" class="nav-item">Contar</a>
    <a href="relatorios.html" class="nav-item">Relatórios</a>
  </nav>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { getCategories, createCategory, updateCategory, deleteCategory } from './js/database.js';
    import { showToast } from './js/utils.js';

    requireAuth();

    const lista = document.getElementById('listaCategorias');
    const input = document.getElementById('categoryName');
    let editingCategoryId = null;

    function renderCategorias() {
      const categories = getCategories();
      if (!categories.length) {
        lista.innerHTML = '<div class="card"><p>Nenhuma categoria cadastrada.</p></div>';
        return;
      }

      lista.innerHTML = categories.map(cat => `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
          <div><strong>${cat.name}</strong></div>
          <div class="row-actions">
            <button class="btn btn-secondary edit-cat" data-id="${cat.id}" data-name="${cat.name}">Editar</button>
            <button class="btn btn-danger delete-cat" data-id="${cat.id}">Excluir</button>
          </div>
        </div>
      `).join('');

      lista.querySelectorAll('.edit-cat').forEach(button => {
        button.addEventListener('click', () => {
          editingCategoryId = button.dataset.id;
          input.value = button.dataset.name;
          document.getElementById('addCategoryBtn').textContent = 'Salvar';
        });
      });

      lista.querySelectorAll('.delete-cat').forEach(button => {
        button.addEventListener('click', () => {
          if (!confirm('Excluir esta categoria?')) return;
          deleteCategory(button.dataset.id);
          renderCategorias();
          showToast('Categoria removida');
        });
      });
    }

    function resetForm() {
      editingCategoryId = null;
      input.value = '';
      document.getElementById('addCategoryBtn').textContent = 'Adicionar';
    }

    document.getElementById('addCategoryBtn').addEventListener('click', () => {
      const name = input.value.trim();
      if (!name) return showToast('Informe o nome da categoria', 'error');

      if (editingCategoryId) {
        updateCategory(editingCategoryId, name);
        showToast('Categoria atualizada');
      } else {
        createCategory(name);
        showToast('Categoria criada');
      }

      resetForm();
      renderCategorias();
    });

    renderCategorias();
  </script>
</body>
</html>
