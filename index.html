<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SmartStock - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#6366f1">
</head>
<body>
  <main class="auth-page">
    <section class="auth-panel">
      <div class="brand-mark">SS</div>
      <h1>SmartStock</h1>
      <p class="auth-subtitle">Sistema de estoque local e rápido.</p>

      <div id="loginForm">
        <input type="email" id="loginEmail" class="input" placeholder="E-mail" autocomplete="email">
        <input type="password" id="loginPassword" class="input" placeholder="Senha" autocomplete="current-password">
        <button class="btn btn-primary btn-block" onclick="handleLogin()">Entrar</button>
        <button class="btn btn-secondary btn-block" style="margin-top:8px;" onclick="handleDemoLogin()">Entrar como teste</button>
        <button class="link-button" onclick="showRegister()">Criar conta</button>
      </div>

      <div id="registerForm" style="display:none;">
        <input type="text" id="regName" class="input" placeholder="Nome completo" autocomplete="name">
        <input type="email" id="regEmail" class="input" placeholder="E-mail" autocomplete="email">
        <input type="password" id="regPassword" class="input" placeholder="Senha" autocomplete="new-password">
        <button class="btn btn-primary btn-block" onclick="handleRegister()">Cadastrar</button>
        <button class="link-button" onclick="showLogin()">Já tenho conta</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { loginUser, registerUser } from './js/auth.js';
    import { showToast } from './js/utils.js';

    window.showRegister = function() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    };

    window.showLogin = function() {
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    };

    window.handleLogin = async function() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) return showToast('Informe e-mail e senha', 'error');

      try {
        await loginUser(email, password);
        window.location.href = 'dashboard.html';
      } catch (error) {
        showToast(error.message || 'Erro ao efetuar login', 'error');
      }
    };

    window.handleRegister = async function() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      if (!name || !email || !password) return showToast('Preencha todos os campos', 'error');

      try {
        await registerUser(email, password, name);
        window.location.href = 'dashboard.html';
      } catch (error) {
        showToast(error.message || 'Erro ao cadastrar usuário', 'error');
      }
    };

    window.handleDemoLogin = async function() {
      try {
        await loginUser('admin@smartstock.com', '123456');
        window.location.href = 'dashboard.html';
      } catch (error) {
        showToast('Falha ao entrar como teste', 'error');
      }
    };
  </script>
</body>
</html>
