<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SmartStock - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
</head>
<body>
  <!-- conteúdo igual ao anterior (código HTML do formulário) -->
  <!-- ... -->

  <!-- Agora usamos um único script type="module" que importa tudo -->
  <script type="module">
    import { loginUser, registerUser } from "./js/auth.js";
    import { showToast } from "./js/utils.js";

    // deixe as funções globais para os botões
    window.showRegister = function() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    };
    window.showLogin = function() {
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    };

    window.handleLogin = async function() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        await loginUser(email, password);
        window.location.href = 'dashboard.html';
      } catch (e) {
        showToast(e.message, 'error');
      }
    };

    window.handleRegister = async function() {
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      try {
        await registerUser(email, password, name);
        window.location.href = 'dashboard.html';
      } catch (e) {
        showToast(e.message, 'error');
      }
    };
  </script>
</body>
</html>
