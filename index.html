<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SmartStock - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
</head>
<body>
  <div class="page" style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
    <div style="width:100%; max-width:400px;">
      <!-- Logo -->
      <div style="text-align:center; margin-bottom:40px;">
        <div style="width:80px;height:80px;background:var(--primary);border-radius:24px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        </div>
        <h1 style="font-size:28px; font-weight:800; color:var(--text);">SmartStock</h1>
        <p style="color:var(--text-light);">Controle de Estoque Inteligente</p>
      </div>

      <!-- Formulário Login -->
      <div id="loginForm" class="card">
        <h2 style="margin-bottom:20px;">Entrar</h2>
        <input type="email" id="loginEmail" class="input" placeholder="E-mail" style="margin-bottom:12px;">
        <input type="password" id="loginPassword" class="input" placeholder="Senha" style="margin-bottom:20px;">
        <button onclick="handleLogin()" class="btn btn-primary btn-block">Entrar</button>
        <p style="text-align:center; margin-top:16px; color:var(--text-light);">
          Não tem conta? <a href="#" onclick="showRegister()" style="color:var(--primary); font-weight:600;">Cadastre-se</a>
        </p>
      </div>

      <!-- Formulário Cadastro (oculto) -->
      <div id="registerForm" class="card" style="display:none;">
        <h2 style="margin-bottom:20px;">Criar Conta</h2>
        <input type="text" id="regName" class="input" placeholder="Nome completo" style="margin-bottom:12px;">
        <input type="email" id="regEmail" class="input" placeholder="E-mail" style="margin-bottom:12px;">
        <input type="password" id="regPassword" class="input" placeholder="Senha" style="margin-bottom:20px;">
        <button onclick="handleRegister()" class="btn btn-primary btn-block">Cadastrar</button>
        <p style="text-align:center; margin-top:16px; color:var(--text-light);">
          Já tem conta? <a href="#" onclick="showLogin()" style="color:var(--primary); font-weight:600;">Entrar</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/database.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>

  <script>
    function showRegister() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    }
    function showLogin() {
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        await loginUser(email, password);
        window.location.href = 'dashboard.html';
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function handleRegister() {
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      try {
        await registerUser(email, password, name);
        window.location.href = 'dashboard.html';
      } catch (e) {
        showToast(e.message, 'error');
      }
    }
  </script>
</body>
</html>
