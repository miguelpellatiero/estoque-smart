<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SmartStock - Contador</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <h1>Contador</h1>
    <button onclick="location.href='dashboard.html'" class="btn btn-secondary" style="padding:8px 16px;">Voltar</button>
  </div>

  <div class="page">
    <input type="text" id="searchProduct" class="input" placeholder="Buscar por nome ou SKU...">
    <div id="searchResults" style="margin-top:16px;"></div>
    <button id="quickCreateBtn" class="btn btn-secondary btn-block" style="margin-top:16px;">Criar produto rápido</button>

    <div id="quickCreateCard" class="card" style="display:none; margin-top:16px;">
      <h2>Criar produto</h2>
      <input type="text" id="quickName" class="input" placeholder="Nome do produto">
      <input type="text" id="quickSku" class="input" placeholder="SKU (opcional)">
      <select id="quickCategory" class="input">
        <option value="">Sem categoria</option>
      </select>
      <select id="quickPattern" class="input">
        <option value="">Endereço automático</option>
      </select>
      <input type="number" id="quickQty" class="input" placeholder="Quantidade inicial" value="0" min="0">
      <input type="text" id="quickAddress" class="input" placeholder="Endereco (automatico se vazio)">
      <p style="color:var(--text-light); font-size:13px; margin-bottom:8px;">Fotos do produto</p>
      <input type="file" id="quickImages" class="input" accept="image/*" multiple capture="environment">
      <div id="quickPreview" class="image-preview-grid"></div>
      <div class="modal-actions" style="margin-top:12px;">
        <button id="saveQuickProductBtn" class="btn btn-primary">Salvar produto</button>
        <button id="cancelQuickCreateBtn" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>

    <div id="selectedProductInfo" class="card" style="display:none;">
      <h2 id="productName"></h2>
      <p id="productSku"></p>
      <p id="productAddress"></p>
      <p>Estoque atual: <strong id="productCurrentQty"></strong></p>
    </div>

    <div id="counterArea" class="counter-container" style="display:none;">
      <div class="counter-buttons">
        <button id="minusBtn" class="counter-btn counter-btn-minus">-</button>
        <div id="countDisplay" class="counter-display">0</div>
        <button id="plusBtn" class="counter-btn counter-btn-plus">+</button>
      </div>
      <input type="number" id="manualQty" class="input" min="0" style="margin-top:20px;" placeholder="Digitar quantidade">
      <p style="color:var(--text-light); font-size:13px; margin-bottom:8px;">Fotos da contagem</p>
      <input type="file" id="countImages" class="input" accept="image/*" multiple capture="environment">
      <div id="countPreview" class="image-preview-grid"></div>
      <button id="confirmBtn" class="btn btn-primary btn-block" style="margin-top:16px;">Confirmar contagem</button>
      <button id="clearBtn" class="btn btn-secondary btn-block" style="margin-top:8px;">Limpar</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">Inicio</a>
    <a href="produtos.html" class="nav-item">Produtos</a>
    <a href="contador.html" class="nav-item active">Contar</a>
    <a href="relatorios.html" class="nav-item">Relatorios</a>
  </nav>

  <script type="module">
    import { auth, db } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
    import { searchProducts, updateProductCount, createProduct, getCategories, getAddressPatterns } from "./js/database.js";
    import { showToast } from "./js/utils.js";

    onAuthStateChanged(auth, user => { if (!user) window.location.href = 'index.html'; });

    let selectedProduct = null;
    let countedQty = 0;
    let categorias = [];
    let padroes = [];

    function previewQuickImages() {
      const files = Array.from(document.getElementById('quickImages').files);
      const preview = document.getElementById('quickPreview');
      preview.innerHTML = files.map(file => `<img src="${URL.createObjectURL(file)}" class="photo-preview">`).join('');
    }

    function previewCountImages() {
      const files = Array.from(document.getElementById('countImages').files);
      const preview = document.getElementById('countPreview');
      preview.innerHTML = files.map(file => `<img src="${URL.createObjectURL(file)}" class="photo-preview">`).join('');
    }

    function updateDisplay() {
      document.getElementById('countDisplay').textContent = countedQty;
      document.getElementById('manualQty').value = countedQty;
    }

    function clearSelection() {
      selectedProduct = null;
      countedQty = 0;
      document.getElementById('selectedProductInfo').style.display = 'none';
      document.getElementById('counterArea').style.display = 'none';
      document.getElementById('searchProduct').value = '';
      document.getElementById('searchResults').innerHTML = '';
      updateDisplay();
    }
    async function carregarCategorias() {
      const select = document.getElementById('quickCategory');
      categorias = await getCategories();
      select.innerHTML = '<option value="">Sem categoria</option>';
      categorias.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = cat.name;
        select.appendChild(opt);
      });
    }

    async function carregarPadroes() {
      const select = document.getElementById('quickPattern');
      padroes = await getAddressPatterns();
      select.innerHTML = '<option value="">Endereço automático</option>';
      padroes.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.name} — ${p.format}`;
        select.appendChild(opt);
      });
    }

    document.getElementById('quickCreateBtn').addEventListener('click', () => {
      document.getElementById('quickCreateCard').style.display = 'block';
      document.getElementById('searchProduct').blur();
    });

    document.getElementById('cancelQuickCreateBtn').addEventListener('click', () => {
      document.getElementById('quickCreateCard').style.display = 'none';
      document.getElementById('quickImages').value = '';
      document.getElementById('quickPreview').innerHTML = '';
    });

    document.getElementById('quickImages').addEventListener('change', previewQuickImages);
    document.getElementById('countImages').addEventListener('change', previewCountImages);

    document.getElementById('saveQuickProductBtn').addEventListener('click', async () => {
      const name = document.getElementById('quickName').value.trim();
      if (!name) return showToast('Informe o nome do produto', 'error');

      const categoryId = document.getElementById('quickCategory').value || null;
      const categoryName = categoryId ? (categorias.find(cat => cat.id === categoryId)?.name || '') : '';
      const patternId = document.getElementById('quickPattern').value || null;
      const imageFiles = Array.from(document.getElementById('quickImages').files);

      const data = {
        name,
        sku: document.getElementById('quickSku').value.trim(),
        categoryId,
        categoryName,
        quantity: Number(document.getElementById('quickQty').value) || 0,
        address: document.getElementById('quickAddress').value.trim() || null,
        addressPatternId: patternId
      };

      try {
        await createProduct(data, imageFiles);
        showToast('Produto criado e disponível para contagem');
        document.getElementById('quickCreateCard').style.display = 'none';
        document.getElementById('quickName').value = '';
        document.getElementById('quickSku').value = '';
        document.getElementById('quickQty').value = '0';
        document.getElementById('quickAddress').value = '';
        document.getElementById('quickImages').value = '';
        document.getElementById('quickPreview').innerHTML = '';
      } catch (e) {
        showToast('Erro: ' + (e.message || e), 'error');
      }
    });

    carregarCategorias();
    carregarPadroes();

    async function selectProduct(id) {
      const docSnap = await getDoc(doc(db, 'products', id));
      if (!docSnap.exists()) return showToast('Produto nao encontrado', 'error');
      selectedProduct = { id, ...docSnap.data() };
      countedQty = Number(selectedProduct.quantity) || 0;

      document.getElementById('productName').textContent = selectedProduct.name || '';
      document.getElementById('productSku').textContent = 'SKU: ' + (selectedProduct.sku || '');
      document.getElementById('productAddress').textContent = 'Endereco: ' + (selectedProduct.address || 'Sem endereco');
      document.getElementById('productCurrentQty').textContent = countedQty + ' un';
      document.getElementById('selectedProductInfo').style.display = 'block';
      document.getElementById('counterArea').style.display = 'block';
      document.getElementById('searchResults').innerHTML = '';
      updateDisplay();
    }

    document.getElementById('searchProduct').addEventListener('input', async (e) => {
      const term = e.target.value.trim();
      const container = document.getElementById('searchResults');
      if (term.length < 2) {
        container.innerHTML = '';
        return;
      }

      const results = await searchProducts(term);
      container.innerHTML = results.map(p => `
        <div class="card search-result" data-id="${p.id}" style="cursor:pointer;">
          <strong>${p.name || ''}</strong><br>
          <small>SKU: ${p.sku || ''} | End: ${p.address || 'N/A'} | Qtd: ${p.quantity || 0}</small>
        </div>
      `).join('');

      container.querySelectorAll('.search-result').forEach(item => {
        item.addEventListener('click', () => selectProduct(item.dataset.id));
      });
    });

    document.getElementById('minusBtn').addEventListener('click', () => {
      countedQty = Math.max(0, countedQty - 1);
      updateDisplay();
    });

    document.getElementById('plusBtn').addEventListener('click', () => {
      countedQty += 1;
      updateDisplay();
    });

    document.getElementById('manualQty').addEventListener('input', (e) => {
      countedQty = Math.max(0, Number(e.target.value) || 0);
      document.getElementById('countDisplay').textContent = countedQty;
    });

    document.getElementById('confirmBtn').addEventListener('click', async () => {
      if (!selectedProduct) return;
      const imageFiles = Array.from(document.getElementById('countImages').files);
      try {
        await updateProductCount(selectedProduct.id, countedQty, imageFiles);
        showToast('Contagem salva');
        clearSelection();
      } catch (e) {
        showToast('Erro: ' + (e.message || e), 'error');
      }
    });

    document.getElementById('clearBtn').addEventListener('click', clearSelection);
  </script>
</body>
</html>
