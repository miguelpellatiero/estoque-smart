<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SmartStock - Contador</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <h1>🔢 Contador</h1>
    <button onclick="logoutUser()" class="btn btn-secondary" style="padding:8px 16px;">Sair</button>
  </div>

  <div class="page">
    <!-- Busca de produto -->
    <input type="text" id="searchProduct" class="input" placeholder="🔍 Buscar produto (nome, SKU, endereço)..." oninput="searchProductsHandler()">
    <div id="searchResults" style="margin-top:8px;"></div>

    <!-- Produto selecionado -->
    <div id="selectedProductInfo" class="card" style="display:none;">
      <h3 id="productName"></h3>
      <p style="color:var(--text-light);" id="productSku"></p>
      <p style="color:var(--text-light);" id="productAddress"></p>
      <p>Estoque atual: <strong id="productCurrentQty"></strong></p>
      <button onclick="clearSelection()" class="btn btn-secondary" style="margin-top:8px;">Trocar produto</button>
    </div>

    <!-- Contador -->
    <div id="counterArea" style="display:none;">
      <div class="counter-container">
        <div class="counter-buttons">
          <button class="counter-btn counter-btn-minus" onclick="decrement()" onmousedown="startLongPress('dec')" onmouseup="stopLongPress()" onmouseleave="stopLongPress()" ontouchstart="startLongPress('dec')" ontouchend="stopLongPress()">−</button>
          <span class="counter-display" id="countDisplay">0</span>
          <button class="counter-btn counter-btn-plus" onclick="increment()" onmousedown="startLongPress('inc')" onmouseup="stopLongPress()" onmouseleave="stopLongPress()" ontouchstart="startLongPress('inc')" ontouchend="stopLongPress()">+</button>
        </div>
      </div>

      <!-- Foto -->
      <div style="margin:16px 0;">
        <button onclick="openCamera()" class="btn btn-secondary" style="margin-right:8px;">📷 Tirar foto</button>
        <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handleFileSelect(event)" style="display:none;">
        <button onclick="document.getElementById('photoInput').click()" class="btn btn-secondary">🖼️ Galeria</button>
        <img id="photoPreview" class="photo-preview" style="display:none;">
      </div>

      <button onclick="confirmCount()" class="btn btn-primary btn-block">✅ Confirmar Contagem</button>
    </div>

    <!-- Histórico rápido -->
    <div style="margin-top:32px;">
      <h3>Últimas contagens</h3>
      <div id="recentCounts"></div>
    </div>
  </div>

  <!-- Câmera modal -->
  <div id="cameraModal" class="camera-container" style="display:none;">
    <video id="video" autoplay playsinline></video>
    <button class="capture-btn" onclick="capturePhoto()"></button>
    <button onclick="closeCamera()" style="position:absolute; top:20px; right:20px; background:white; border:none; border-radius:50%; width:40px; height:40px; font-size:20px;">✕</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/database.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    let selectedProduct = null;
    let countedQty = 0;
    let photoFile = null;
    let longPressTimer = null;
    let longPressInterval = null;

    // Verificar auth
    auth.onAuthStateChanged(user => { if (!user) window.location.href = 'index.html'; });

    async function searchProductsHandler() {
      const term = document.getElementById('searchProduct').value;
      if (term.length < 2) { document.getElementById('searchResults').innerHTML = ''; return; }
      
      const results = await searchProducts(term);
      const container = document.getElementById('searchResults');
      container.innerHTML = results.map(p => `
        <div class="card" onclick="selectProduct('${p.id}')" style="cursor:pointer;">
          <strong>${p.name}</strong><br>
          <small>SKU: ${p.sku} | End: ${p.address || 'N/A'} | Qtd: ${p.quantity}</small>
        </div>
      `).join('');
    }

    async function selectProduct(id) {
      const doc = await productsRef.doc(id).get();
      selectedProduct = { id, ...doc.data() };
      countedQty = selectedProduct.quantity;
      
      document.getElementById('productName').textContent = selectedProduct.name;
      document.getElementById('productSku').textContent = 'SKU: ' + selectedProduct.sku;
      document.getElementById('productAddress').textContent = '📍 ' + (selectedProduct.address || 'Sem endereço');
      document.getElementById('productCurrentQty').textContent = selectedProduct.quantity + ' un';
      document.getElementById('selectedProductInfo').style.display = 'block';
      document.getElementById('counterArea').style.display = 'block';
      document.getElementById('countDisplay').textContent = countedQty;
      document.getElementById('searchResults').innerHTML = '';
      document.getElementById('searchProduct').value = '';
    }

    function clearSelection() {
      selectedProduct = null;
      document.getElementById('selectedProductInfo').style.display = 'none';
      document.getElementById('counterArea').style.display = 'none';
      photoFile = null;
      document.getElementById('photoPreview').style.display = 'none';
    }

    function increment() { countedQty++; updateDisplay(); }
    function decrement() { if (countedQty > 0) countedQty--; updateDisplay(); }
    function updateDisplay() { document.getElementById('countDisplay').textContent = countedQty; }

    // Long press
    function startLongPress(type) {
      longPressTimer = setTimeout(() => {
        longPressInterval = setInterval(() => {
          type === 'inc' ? increment() : decrement();
        }, 80);
      }, 400);
    }
    function stopLongPress() {
      clearTimeout(longPressTimer);
      clearInterval(longPressInterval);
    }

    // Câmera
    async function openCamera() {
      const modal = document.getElementById('cameraModal');
      modal.style.display = 'block';
      const video = document.getElementById('video');
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
    }
    function closeCamera() {
      document.getElementById('cameraModal').style.display = 'none';
      const stream = document.getElementById('video').srcObject;
      if (stream) stream.getTracks().forEach(t => t.stop());
    }
    function capturePhoto() {
      const video = document.getElementById('video');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      canvas.toBlob(async blob => {
        photoFile = new File([blob], 'foto.jpg', { type: 'image/jpeg' });
        document.getElementById('photoPreview').src = URL.createObjectURL(blob);
        document.getElementById('photoPreview').style.display = 'block';
        closeCamera();
      }, 'image/jpeg', 0.8);
    }
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        photoFile = file;
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('photoPreview').src = e.target.result;
          document.getElementById('photoPreview').style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    async function confirmCount() {
      if (!selectedProduct) return;
      try {
        await updateProductCount(selectedProduct.id, countedQty, photoFile);
        showToast('Contagem salva!');
        
        // Adiciona ao histórico local
        const historyDiv = document.getElementById('recentCounts');
        historyDiv.innerHTML = `
          <div class="card">
            <strong>${selectedProduct.name}</strong> → ${countedQty} un
            <small style="float:right;">${new Date().toLocaleTimeString()}</small>
          </div>
        ` + historyDiv.innerHTML;
        
        clearSelection();
      } catch (e) {
        showToast('Erro: ' + e.message, 'error');
      }
    }

    // Carregar últimas contagens
    async function loadRecentCounts() {
      const snap = await movementsRef.where('type', '==', 'count').orderBy('createdAt', 'desc').limit(10).get();
      const container = document.getElementById('recentCounts');
      container.innerHTML = '';
      for (const doc of snap.docs) {
        const m = doc.data();
        const prod = await productsRef.doc(m.productId).get();
        container.innerHTML += `
          <div class="card">
            <strong>${prod.data()?.name || 'Produto'}</strong> → ${m.newQuantity} un
            <small style="color:var(--text-light);">${formatDate(m.createdAt)}</small>
          </div>
        `;
      }
    }
    loadRecentCounts();
  </script>
</body>
</html>
