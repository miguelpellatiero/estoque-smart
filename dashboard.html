<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SmartStock - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#6366f1">
</head>
<body>
  <div class="header">
    <h1>📦 SmartStock</h1>
    <div class="avatar" id="userAvatar"></div>
  </div>

  <div class="page">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px;">
      <div class="card" style="text-align:center;">
        <p style="color:var(--text-light); font-size:14px;">Total de Produtos</p>
        <p id="totalProducts" style="font-size:32px; font-weight:800;">0</p>
      </div>
      <div class="card" style="text-align:center;">
        <p style="color:var(--text-light); font-size:14px;">Estoque Baixo</p>
        <p id="lowStock" style="font-size:32px; font-weight:800; color:var(--danger);">0</p>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <a href="produtos.html" class="card" style="text-decoration:none; color:var(--text);">
        <div style="font-size:32px; margin-bottom:8px;">📦</div>
        <h3>Produtos</h3>
        <p style="color:var(--text-light); font-size:14px;">Gerenciar itens</p>
      </a>
      <a href="contador.html" class="card" style="text-decoration:none; color:var(--text); background:#ecfdf5; border:2px solid var(--success);">
        <div style="font-size:32px; margin-bottom:8px;">🧮</div>
        <h3>Contador</h3>
        <p style="color:var(--text-light); font-size:14px;">Fazer inventário</p>
      </a>
      <a href="categorias.html" class="card" style="text-decoration:none; color:var(--text);">
        <div style="font-size:32px; margin-bottom:8px;">🗂️</div>
        <h3>Categorias</h3>
        <p style="color:var(--text-light); font-size:14px;">Organizar itens</p>
      </a>
      <a href="relatorios.html" class="card" style="text-decoration:none; color:var(--text);">
        <div style="font-size:32px; margin-bottom:8px;">📈</div>
        <h3>Relatórios</h3>
        <p style="color:var(--text-light); font-size:14px;">Exportar estoque</p>
      </a>
    </div>

    <button id="logoutBtn" class="btn btn-secondary btn-block" style="margin-top:24px;">Sair</button>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active">🏠 Início</a>
    <a href="produtos.html" class="nav-item">📦 Produtos</a>
    <a href="contador.html" class="nav-item">🧮 Contar</a>
    <a href="relatorios.html" class="nav-item">📈 Relatórios</a>
  </nav>

  <script type="module">
    import { requireAuth, logoutUser, getCurrentUser } from './js/auth.js';
    import { getProducts } from './js/database.js';

    const user = requireAuth();
    if (user) {
      document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
    }

    const products = getProducts();
    const total = products.length;
    const lowStock = products.filter(p => Number(p.quantity) < 5).length;

    document.getElementById('totalProducts').textContent = total;
    document.getElementById('lowStock').textContent = lowStock;

    document.getElementById('logoutBtn').addEventListener('click', logoutUser);
  </script>
</body>
</html>
