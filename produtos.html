<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SmartStock - Produtos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <h1>Produtos</h1>
    <button onclick="location.href='dashboard.html'" class="btn btn-secondary" style="padding:8px 16px;">Voltar</button>
  </div>

  <div class="page">
    <button id="novoProdutoBtn" class="btn btn-primary btn-block" style="margin-bottom:16px;">Novo Produto</button>
    <input type="text" id="searchInput" class="input" placeholder="Buscar produtos...">
    <div id="listaProdutos" style="margin-top:16px;"></div>
  </div>

  <div id="modalProduto" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Novo Produto</h2>
      <input type="text" id="prodName" class="input" placeholder="Nome do produto">
      <input type="text" id="prodSku" class="input" placeholder="SKU (opcional)">
      <select id="prodCategory" class="input">
        <option value="">Sem categoria</option>
      </select>
      <input type="number" id="prodQty" class="input" placeholder="Quantidade inicial" value="0" min="0">
      <input type="text" id="prodAddress" class="input" placeholder="Endereco (automatico se vazio)">
      <div class="modal-actions">
        <button id="salvarProdutoBtn" class="btn btn-primary">Salvar</button>
        <button id="cancelarProdutoBtn" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">Inicio</a>
    <a href="produtos.html" class="nav-item active">Produtos</a>
    <a href="contador.html" class="nav-item">Contar</a>
    <a href="relatorios.html" class="nav-item">Relatorios</a>
  </nav>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { createProduct, updateProduct, deleteProduct, listenProducts, getCategories } from "./js/database.js";
    import { showToast } from "./js/utils.js";

    onAuthStateChanged(auth, user => { if (!user) window.location.href = 'index.html'; });

    let produtos = [];
    let editingId = null;

    function renderizarLista(lista = produtos) {
      const container = document.getElementById('listaProdutos');
      if (lista.length === 0) {
        container.innerHTML = '<div class="card"><p>Nenhum produto encontrado.</p></div>';
        return;
      }

      container.innerHTML = lista.map(p => `
        <div class="card product-row">
          <div>
            <strong>${p.name || ''}</strong> <small>${p.sku || ''}</small><br>
            <small style="color:var(--text-light);">End: ${p.address || 'N/A'} | Qtd: ${p.quantity || 0}</small>
          </div>
          <div class="row-actions">
            <button class="btn btn-secondary edit-btn" data-id="${p.id}">Editar</button>
            <button class="btn btn-danger delete-btn" data-id="${p.id}">Excluir</button>
          </div>
        </div>
      `).join('');

      container.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => abrirEdicao(btn.dataset.id));
      });
      container.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => excluirProduto(btn.dataset.id));
      });
    }

    async function carregarCategorias() {
      const select = document.getElementById('prodCategory');
      const categorias = await getCategories();
      select.innerHTML = '<option value="">Sem categoria</option>';
      categorias.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = cat.name;
        select.appendChild(opt);
      });
    }

    function abrirModal() {
      document.getElementById('modalProduto').style.display = 'flex';
    }

    function fecharModal() {
      document.getElementById('modalProduto').style.display = 'none';
    }

    function limparFormulario() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Novo Produto';
      document.getElementById('prodName').value = '';
      document.getElementById('prodSku').value = '';
      document.getElementById('prodCategory').value = '';
      document.getElementById('prodQty').value = '0';
      document.getElementById('prodAddress').value = '';
    }

    function abrirEdicao(id) {
      const prod = produtos.find(p => p.id === id);
      if (!prod) return;
      editingId = id;
      document.getElementById('modalTitle').textContent = 'Editar Produto';
      document.getElementById('prodName').value = prod.name || '';
      document.getElementById('prodSku').value = prod.sku || '';
      document.getElementById('prodCategory').value = prod.categoryId || '';
      document.getElementById('prodQty').value = prod.quantity || 0;
      document.getElementById('prodAddress').value = prod.address || '';
      abrirModal();
    }

    async function excluirProduto(id) {
      if (!confirm('Desativar este produto?')) return;
      await deleteProduct(id);
      showToast('Produto removido');
    }

    document.getElementById('novoProdutoBtn').addEventListener('click', () => {
      limparFormulario();
      abrirModal();
    });

    document.getElementById('cancelarProdutoBtn').addEventListener('click', fecharModal);

    document.getElementById('salvarProdutoBtn').addEventListener('click', async () => {
      const name = document.getElementById('prodName').value.trim();
      if (!name) return showToast('Nome obrigatorio', 'error');

      const data = {
        name,
        sku: document.getElementById('prodSku').value.trim(),
        categoryId: document.getElementById('prodCategory').value || null,
        quantity: Number(document.getElementById('prodQty').value) || 0,
        address: document.getElementById('prodAddress').value.trim() || null
      };

      try {
        if (editingId) {
          await updateProduct(editingId, data);
          showToast('Produto atualizado');
        } else {
          await createProduct(data);
          showToast('Produto criado');
        }
        fecharModal();
      } catch (e) {
        showToast('Erro: ' + (e.message || e), 'error');
      }
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtrados = produtos.filter(p =>
        (p.nameLower || p.name || '').toLowerCase().includes(term) ||
        (p.sku || '').toLowerCase().includes(term) ||
        (p.address || '').toLowerCase().includes(term)
      );
      renderizarLista(filtrados);
    });

    carregarCategorias();
    listenProducts((items) => {
      produtos = items;
      renderizarLista();
    });
  </script>
</body>
</html>
